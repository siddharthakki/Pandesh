schemaVersion: 2
id: provider-model-recovery
title: Provider and model failures produce honest durable recovery states
priority: P2
suites: [recovery, full]
driver: catalogue-contract
profilePolicy: fresh
requiresApprovals: false
prompt: Explain this repository using the configured model.
lifecycle: [Ollama unavailable, configured model unavailable, timeout, crash, Extension Host restart]
steps:
  - submit each failure case through the visible unified composer and visible Send control
  - observe the visible blocker and use only visible retry or recovery actions
assertions:
  - user-visible, durable, filesystem, and Git state agree for every failure
  - no failure is reported as completion and no mutation or stale ownership leaks through recovery
result: { terminalState: blocked }
checks: { visibleUi: true, route: true, durableState: true, filesystem: true, git: true }
evidence: [provider and model identity, failure classification, DOM, screenshots, durable events, files, Git, logs, and JUnit]
