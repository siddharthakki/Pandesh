schemaVersion: 2
id: uninstall-reinstall-policy
title: Uninstall and reinstall obey the documented profile and workspace survival policy
priority: P1
suites: [installation, full]
driver: catalogue-contract
profilePolicy: same
requiresApprovals: true
prompt: create reinstalled.txt containing Reinstalled
lifecycle: [fresh-profile install, existing-profile install, uninstall, reinstall, reopen workspace]
steps:
  - submit baseline state through the visible unified composer and visible Send control before uninstall
  - uninstall, reinstall exact packages, reopen the same profile, and approve recovery through visible controls
assertions:
  - the documented policy explicitly covers profile uninstall, extension reinstall, workspace reopen, VS Code upgrade, and KarkeDikha upgrade
  - visible, durable, filesystem, and Git results match that policy without stale approval or task resurrection
result: { file: reinstalled.txt, content: Reinstalled, terminalState: completed }
checks: { visibleUi: true, route: true, durableState: true, filesystem: true, git: true, restartResult: true }
evidence: [install and uninstall logs, package provenance, profile identity, DOM, screenshots, files, Git, logs, and JUnit]
