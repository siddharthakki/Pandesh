schemaVersion: 2
id: upgrade-downgrade-migration
title: Existing-profile upgrade migrates durable state and defines downgrade behavior
priority: P1
suites: [installation, full]
driver: catalogue-contract
profilePolicy: same
requiresApprovals: true
prompt: create upgraded.txt containing Upgraded
lifecycle: [install version N, persist conversation and task state, upgrade to N plus one, reopen, test supported downgrade]
steps:
  - submit baseline work through the visible unified composer and visible Send control on version N
  - upgrade, reopen the same profile, approve through visible controls, and inspect documented migration and downgrade behavior
assertions:
  - activation succeeds and conversation, task, approval, and schema identities follow documented survival policy
  - incompatible or corrupted state fails closed without silent loss or cross-workspace projection
result: { file: upgraded.txt, content: Upgraded, terminalState: completed }
checks: { visibleUi: true, route: true, durableState: true, filesystem: true, git: true, restartResult: true }
evidence: [both VSIX provenances, schema before and after, DOM, screenshots, files, Git, logs, and JUnit]
