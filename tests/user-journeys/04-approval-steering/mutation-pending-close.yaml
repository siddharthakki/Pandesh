schemaVersion: 2
id: mutation-pending-close
title: Mutation approval restores once after full close and reopen
priority: P1
p1Index: 6
suites: [p1, lifecycle, full]
driver: p1-lifecycle
profilePolicy: same
requiresApprovals: true
prompt: create pending-mutation.txt containing Pending
lifecycle: [proposal approved, mutation pending, close VS Code, reopen same profile and workspace, resolve original approval]
steps:
  - select Karke Dikha and submit through the visible unified composer and visible Send control
  - approve proposal through visible controls, leave mutation pending, close every test-owned VS Code window, and reopen the same profile
  - reject the restored exact mutation through visible controls
assertions:
  - the same conversation task attempt and mutation approval restore once and remain actionable
  - no workspace mutation, duplicate gate, or resurrected task remains
result: { absentFile: pending-mutation.txt, terminalState: cancelled }
checks: { visibleUi: true, route: true, durableState: true, filesystem: true, git: true, restartResult: true }
evidence: [task attempt and approval IDs, DOM, screenshots, task events, exact files, Git, process exits, logs, and JUnit]
