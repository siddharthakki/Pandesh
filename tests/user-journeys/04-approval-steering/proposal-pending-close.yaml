schemaVersion: 2
id: proposal-pending-close
title: Proposal approval restores once after full close and reopen
priority: P1
p1Index: 5
suites: [p1, lifecycle, full]
driver: p1-lifecycle
profilePolicy: same
requiresApprovals: true
prompt: create pending-proposal.txt containing Pending
lifecycle: [proposal pending, close VS Code, reopen same profile and workspace, resolve original approval]
steps:
  - select Karke Dikha and submit through the visible unified composer and visible Send control
  - leave the proposal pending, close every test-owned VS Code window, reopen the same profile, and resolve through visible controls
assertions:
  - the same conversation task attempt and proposal approval restore once and remain actionable
  - rejection controls the original approval and no workspace mutation occurs
result: { absentFile: pending-proposal.txt, terminalState: cancelled }
checks: { visibleUi: true, route: true, durableState: true, filesystem: true, git: true, restartResult: true }
evidence: [task attempt and approval IDs, DOM, screenshots, task events, exact files, Git, process exits, logs, and JUnit]
