<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian space backdrop -->
    <radialGradient id="deepVoid" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="60%" stop-color="#05080f" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Translucent glass sphere gradient -->
    <radialGradient id="glassSphere" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.6" />
    </radialGradient>

    <!-- Sphere rim lighting -->
    <linearGradient id="sphereRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neural Bus / Network Node Gradients -->
    <linearGradient id="synapticTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="eyeIrisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>

    <!-- Atmospheric core aura -->
    <radialGradient id="retinaAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Specular highlight gradient on sphere glass -->
    <linearGradient id="glassReflection" x1="20%" y1="10%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseCore" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="sharp" />
      <feGaussianBlur stdDeviation="14" result="soft" />
      <feMerge>
        <feMergeNode in="soft" />
        <feMergeNode in="sharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Canvas Frame -->
  <rect width="512" height="512" rx="120" fill="url(#deepVoid)" />
  <rect width="508" height="508" x="2" y="2" rx="118" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- ================= BACKGROUND NETWORK: PERIPHERAL NODES & BUSES ================= -->
  <!-- Outer perimeter constellation nodes -->
  <g stroke="url(#synapticTrace)" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <!-- Synaptic lines originating from perimeter points converging into the sphere -->
    <line x1="60" y1="90" x2="160" y2="160" />
    <line x1="452" y1="90" x2="352" y2="160" />
    <line x1="60" y1="422" x2="160" y2="352" />
    <line x1="452" y1="422" x2="352" y2="352" />

    <line x1="256" y1="36" x2="256" y2="120" stroke-dasharray="4 4" />
    <line x1="256" y1="476" x2="256" y2="392" stroke-dasharray="4 4" />
    <line x1="36" y1="256" x2="120" y2="256" stroke-dasharray="4 4" />
    <line x1="476" y1="256" x2="392" y2="256" stroke-dasharray="4 4" />

    <!-- Isometric data routing tracks -->
    <path d="M 60 90 L 110 90 L 160 140" stroke-opacity="0.4" />
    <path d="M 452 90 L 402 90 L 352 140" stroke-opacity="0.4" />
    <path d="M 60 422 L 110 422 L 160 372" stroke-opacity="0.4" />
    <path d="M 452 422 L 402 422 L 352 372" stroke-opacity="0.4" />
  </g>

  <!-- Peripheral sensor node dots -->
  <g fill="#0284c7" opacity="0.7">
    <circle cx="60" cy="90" r="3.5" />
    <circle cx="452" cy="90" r="3.5" />
    <circle cx="60" cy="422" r="3.5" />
    <circle cx="452" cy="422" r="3.5" />
    <circle cx="110" cy="90" r="2" fill="#38bdf8" />
    <circle cx="402" cy="90" r="2" fill="#38bdf8" />
    <circle cx="110" cy="422" r="2" fill="#38bdf8" />
    <circle cx="402" cy="422" r="2" fill="#38bdf8" />
  </g>

  <!-- ================= THE CONNECTIVE SPHERE MATRIX ================= -->
  <!-- Equatorial & Polar Synaptic Rings (3D Wireframe Grids wrapping the sphere) -->
  <g fill="none" stroke="#00f2fe" stroke-opacity="0.28" stroke-width="1.5">
    <!-- Horizontal planetary orbits -->
    <ellipse cx="256" cy="256" rx="146" ry="38" />
    <ellipse cx="256" cy="205" rx="130" ry="26" stroke-dasharray="6 6" stroke-opacity="0.18" />
    <ellipse cx="256" cy="307" rx="130" ry="26" stroke-dasharray="6 6" stroke-opacity="0.18" />

    <!-- Tilted polar communication orbitals -->
    <ellipse cx="256" cy="256" rx="146" ry="54" transform="rotate(-35 256 256)" stroke-opacity="0.35" />
    <ellipse cx="256" cy="256" rx="146" ry="54" transform="rotate(35 256 256)" stroke-opacity="0.35" />
  </g>

  <!-- Solid Glass Sphere Body -->
  <circle cx="256" cy="256" r="146" fill="url(#glassSphere)" />
  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#sphereRim)" stroke-width="3" filter="url(#glow)" />

  <!-- Sphere Horizon Connectors (Nodes pinned to the sphere surface) -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="110" cy="256" r="4.5" />
    <circle cx="402" cy="256" r="4.5" />
    <circle cx="256" cy="110" r="4.5" />
    <circle cx="256" cy="402" r="4.5" />
    <circle cx="152" cy="152" r="3.5" />
    <circle cx="360" cy="152" r="3.5" />
    <circle cx="152" cy="360" r="3.5" />
    <circle cx="360" cy="360" r="3.5" />
  </g>

  <!-- ================= THE OMNISCIENT EYE (SUSPENDED INSIDE) ================= -->
  <!-- Ambient glow field behind the eye -->
  <circle cx="256" cy="256" r="88" fill="url(#retinaAura)" />

  <!-- Synthetic Eyelids / Cyber Aperture Contour -->
  <g filter="url(#intenseCore)">
    <!-- Outer Eye Contours (Interlocking Arch Geometry) -->
    <path d="M 160 256 C 188 190, 324 190, 352 256 C 324 322, 188 322, 160 256 Z"
          fill="#031226" fill-opacity="0.8"
          stroke="url(#synapticTrace)" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Inner Eyelid Refraction Trim -->
    <path d="M 178 256 C 202 208, 310 208, 334 256 C 310 304, 202 304, 178 256 Z"
          fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="14 6" />

    <!-- Digital Iris (Geometric Polygon Rings + Core) -->
    <circle cx="256" cy="256" r="44" fill="#041a35" stroke="url(#eyeIrisGrad)" stroke-width="2.5" />

    <!-- Optical Iris Rays (Neural Sensor Fibers) -->
    <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="256" y1="216" x2="256" y2="224" />
      <line x1="256" y1="288" x2="256" y2="296" />
      <line x1="216" y1="256" x2="224" y2="256" />
      <line x1="288" y1="256" x2="296" y2="256" />
      <line x1="228" y1="228" x2="234" y2="234" />
      <line x1="278" y1="278" x2="284" y2="284" />
      <line x1="284" y1="228" x2="278" y2="234" />
      <line x1="234" y1="278" x2="228" y2="284" />
    </g>

    <!-- Pupil: Singularity Chamber -->
    <circle cx="256" cy="256" r="22" fill="#020611" stroke="#00f2fe" stroke-width="2" />

    <!-- White-Hot Neural Focus (Light Center) -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" />
    <circle cx="256" cy="256" r="4" fill="#a5f3fc" />
  </g>

  <!-- Connective Synapses (Linking the Iris directly out to the Sphere Shell) -->
  <g stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round">
    <line x1="160" y1="256" x2="110" y2="256" />
    <line x1="352" y1="256" x2="402" y2="256" />
    <line x1="256" y1="212" x2="256" y2="110" stroke-dasharray="3 5" />
    <line x1="256" y1="300" x2="256" y2="402" stroke-dasharray="3 5" />
  </g>

  <!-- Glass Specular Curved Sheen (Upper-Left Sphere Depth Glare) -->
  <path d="M 145 190 C 160 145, 205 125, 260 120 C 230 130, 180 155, 160 200 C 150 220, 148 235, 148 245 C 145 225, 144 205, 145 190 Z"
        fill="url(#glassReflection)" />

  <!-- Subtle Micro-Glints on Glass Perimeter -->
  <circle cx="170" cy="148" r="3.5" fill="#ffffff" opacity="0.75" filter="url(#glow)" />
  <circle cx="152" cy="168" r="1.5" fill="#ffffff" opacity="0.6" />
</svg>
