<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandesh — Stage B design prototype</title>
<style>
:root {
  --canvas:#0E1013; --surface:#15181D; --raised:#1C2027;
  --ink:#E8E6E1; --muted:#9A9A94; --faint:#5C5C58;
  --pulse:#3DD6C6; --verified:#6AA8FF; --attention:#F0B429; --danger:#E5534B;
  --border:#23272F; --border-strong:#2E333C;
  --shadow-1:0 1px 2px rgba(0,0,0,.25);
  --shadow-2:0 4px 12px rgba(0,0,0,.35);
  --font-ui:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --font-voice:Cambria,Georgia,serif;
  --font-mono:"Cascadia Mono",Consolas,monospace;
}
[data-theme="light"] {
  --canvas:#F4F2EE; --surface:#FFFFFF; --raised:#F0EEE9;
  --ink:#1A1A1A; --muted:#5A5A55; --faint:#8A8A85;
  --pulse:#0E9E90; --verified:#2B6CB0; --attention:#B7791F; --danger:#C53030;
  --border:#E2DFD9; --border-strong:#CFCBC4;
  --shadow-1:0 1px 2px rgba(0,0,0,.08);
  --shadow-2:0 4px 12px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--canvas);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--pulse);text-decoration:none}
.mono{font-family:var(--font-mono);font-size:12px}
.serif{font-family:var(--font-voice)}

/* shell */
.shell{display:grid;grid-template-columns:56px 1fr;grid-template-rows:1fr;height:100vh;overflow:hidden}
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px}
.rail button{width:44px;height:44px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:9px;font-weight:500;transition:background 120ms,color 120ms}
.rail button:hover{background:var(--raised);color:var(--ink)}
.rail button.active{color:var(--pulse);background:rgba(61,214,198,.08)}
.rail .spacer{flex:1}
.rail .logo{width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#0E9E90,#3DD6C6);display:flex;align-items:center;justify-content:center;color:#0E1013;font-weight:700;font-size:13px;margin-bottom:8px}
.main{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.topbar{height:40px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;font-size:12px;color:var(--muted)}
.topbar .title{color:var(--ink);font-weight:600;font-size:13px}
.topbar .spacer{flex:1}
.topbar button{padding:4px 8px;border-radius:4px;font-size:12px;color:var(--muted)}
.topbar button:hover{background:var(--raised);color:var(--ink)}
.content{display:grid;grid-template-columns:1fr var(--pane,0px);overflow:hidden;transition:grid-template-columns 180ms cubic-bezier(.2,.8,.2,1)}
.content.has-pane{--pane:400px}
.content.has-aside{--pane:400px;grid-template-columns:1fr 400px 320px}
.pane{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:16px;display:none}
.content.has-pane .pane,.content.has-aside .pane{display:block}
.aside{border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:16px;display:none}
.content.has-aside .aside{display:block}
.chat{overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:16px}
.chat .hero{font-family:var(--font-voice);font-size:28px;font-weight:400;margin-bottom:4px}
.chat .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.composer{position:sticky;bottom:0;background:var(--canvas);padding:12px 0;border-top:1px solid var(--border);margin-top:auto}
.composer-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.composer-box textarea{background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:14px;resize:none;min-height:40px;width:100%}
.composer-row{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:2px;background:var(--raised);font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.chip.pulse{color:var(--pulse)}
.btn{padding:6px 12px;border-radius:4px;font-size:13px;font-weight:500;transition:background 120ms,transform 120ms}
.btn-primary{background:var(--pulse);color:#0E1013}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--raised);color:var(--ink)}
.btn-danger{color:var(--danger)}
 Prototype data badge
.proto{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:2px;background:rgba(240,180,41,.12);color:var(--attention);font-size:10px;font-family:var(--font-mono);font-weight:600;letter-spacing:.04em}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow-1)}
.card+.card{margin-top:10px}
.h2{font-size:15px;font-weight:600;margin-bottom:8px}
.h3{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:6px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
/* status */
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.running{background:var(--pulse);animation:pulse 1.4s ease-in-out infinite}
.dot.verified{background:var(--verified)}
.dot.attention{background:var(--attention)}
.dot.failed{background:var(--danger)}
.dot.paused{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.stamp{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.04em}
.stamp.verified{background:rgba(106,168,255,.12);color:var(--verified);border:1px solid rgba(106,168,255,.3)}
.stamp.failed{background:rgba(229,83,75,.12);color:var(--danger);border:1px solid rgba(229,83,75,.3)}
.stamp.attention{background:rgba(240,180,41,.12);color:var(--attention);border:1px solid rgba(240,180,41,.3)}
/* mission timeline */
.timeline{display:flex;flex-direction:column;gap:2px}
.step{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:8px;border-radius:4px;align-items:start}
.step:hover{background:var(--raised)}
.step .agent{width:24px;height:24px;border-radius:4px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted)}
.step .agent.lead{background:rgba(61,214,198,.15);color:var(--pulse)}
.step .agent.reviewer{background:rgba(106,168,255,.15);color:var(--verified)}
.step .title{font-size:13px;font-weight:500}
.step .meta{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:2px}
.step .tool{color:var(--pulse)}
.progress{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--pulse);transition:width 240ms ease-out}
/* receipt */
.receipt{max-width:640px;margin:0 auto}
.receipt .stamp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.receipt .objective{font-family:var(--font-voice);font-size:20px;margin-bottom:12px}
.receipt .ops{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.receipt .op{display:flex;align-items:center;gap:6px;font-size:13px}
.receipt .op .n{font-family:var(--font-mono);font-weight:600;color:var(--verified)}
.receipt .artifacts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.artifact{padding:4px 8px;border-radius:4px;background:var(--raised);font-size:11px;font-family:var(--font-mono);display:inline-flex;align-items:center;gap:4px}
.receipt .evidence-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.receipt .evidence-row:last-child{border-bottom:none}
.level{font-size:10px;padding:1px 6px;border-radius:2px;font-family:var(--font-mono)}
.level.observed{background:rgba(106,168,255,.1);color:var(--verified)}
.level.checked{background:rgba(61,214,198,.1);color:var(--pulse)}
.level.reviewed{background:rgba(240,180,41,.1);color:var(--attention)}
.receipt .meta-row{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:var(--font-mono);margin:12px 0}
.receipt .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.receipt .not-changed{background:rgba(229,83,75,.06);border:1px solid rgba(229,83,75,.2);border-radius:6px;padding:10px 12px;margin:10px 0}
.receipt .not-changed li{font-size:12px;color:var(--muted);margin-left:16px}
/* approval */
.approval{background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:14px 16px}
.approval .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.approval dl{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;margin:8px 0}
.approval dt{font-size:11px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.approval dd{font-size:13px}
.approval .detail{background:var(--canvas);border:1px solid var(--border);border-radius:4px;padding:8px;font-family:var(--font-mono);font-size:11px;max-height:120px;overflow:auto;margin:8px 0;white-space:pre-wrap}
.approval .consequence{font-size:12px;color:var(--muted);padding:8px;background:var(--raised);border-radius:4px;margin:8px 0}
.approval .btns{display:flex;gap:8px;margin-top:10px}
/* rehearse */
.rehearse{display:flex;flex-direction:column;gap:10px}
.move-table{width:100%;border-collapse:collapse;font-size:12px}
.move-table th{text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--border)}
.move-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--font-mono)}
.move-table tr.conflict td{background:rgba(240,180,41,.06)}
.banner{padding:8px 10px;border-radius:4px;font-size:12px;display:flex;align-items:flex-start;gap:8px}
.banner.sim{background:rgba(240,180,41,.08);border:1px solid rgba(240,180,41,.25);color:var(--attention)}
.banner.tested{background:rgba(61,214,198,.08);border:1px solid rgba(61,214,198,.25);color:var(--pulse)}
/* workspace */
.ws-section{margin-bottom:14px}
.ws-section h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.storage-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0}
.storage-bar>div{height:100%;background:var(--pulse)}
/* bot */
.bot-id{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bot-avatar{width:40px;height:40px;border-radius:6px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.bot-meta{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
/* state nav */
.statenav{position:fixed;bottom:12px;right:12px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;padding:8px;box-shadow:var(--shadow-2);font-size:11px;max-width:260px;z-index:50}
.statenav h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.statenav button{display:block;width:100%;text-align:left;padding:3px 6px;border-radius:3px;color:var(--muted)}
.statenav button:hover{background:var(--raised);color:var(--ink)}
.statenav button.active{color:var(--pulse);background:rgba(61,214,198,.08)}
.statenav .group{margin-top:6px}
.proto-banner{position:fixed;top:8px;right:8px;background:rgba(240,180,41,.12);color:var(--attention);border:1px solid rgba(240,180,41,.3);padding:4px 8px;border-radius:4px;font-size:10px;font-family:var(--font-mono);z-index:60}
/* compact */
@media (max-width:720px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr 52px}
  .rail{flex-direction:row;height:52px;border-right:none;border-top:1px solid var(--border);order:2;padding:0 8px;gap:4px}
  .rail button{width:48px;height:44px}
  .rail .spacer,.rail .logo{display:none}
  .content.has-pane,.content.has-aside{grid-template-columns:1fr}
  .pane,.aside{position:fixed;bottom:52px;left:0;right:0;height:60vh;border-left:none;border-top:1px solid var(--border);border-radius:12px 12px 0 0;transform:translateY(100%);transition:transform 180ms}
  .pane.open,.aside.open{transform:translateY(0)}
}
/* stamp animation */
@keyframes stampIn{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1);opacity:1}}
.stamp.animate{animation:stampIn 280ms cubic-bezier(.34,1.56,.64,1)}
/* receipt fade */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.receipt{animation:fadeIn 240ms ease-out}
</style>
</head>
<body>
<div class="proto-banner">PROTOTYPE DATA — not connected to Core</div>

<div class="shell">
  <nav class="rail" aria-label="Primary navigation">
    <div class="logo">P</div>
    <button data-dest="chat" class="active" title="Chat"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3h12v8H5l-3 3V3z"/></svg><span>Chat</span></button>
    <button data-dest="bots" title="My Bots"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-5 5-5s5 2.2 5 5"/></svg><span>Bots</span></button>
    <button data-dest="automations" title="Automations"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 4v4l2.5 2.5"/></svg><span>Auto</span></button>
    <button data-dest="projects" title="Projects"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2 6h12"/></svg><span>Proj</span></button>
    <button data-dest="connections" title="Connections"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2v4M10 2v4M6 10v4M10 10v4M2 6h12M2 10h12"/></svg><span>Conn</span></button>
    <button data-dest="tools" title="Tools & Skills"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2l4 4-7 7-4-4 7-7zM2 14l2-2"/></svg><span>Tools</span></button>
    <button data-dest="settings" title="Settings"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6l1.4 1.4M3 13l1.4-1.4M11.6 4.4l1.4-1.4"/></svg><span>Set</span></button>
    <div class="spacer"></div>
    <button id="themeToggle" title="Toggle theme"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15"/></svg><span>Theme</span></button>
  </nav>

  <div class="main">
    <div class="topbar">
      <span class="title" id="topTitle">Pandesh</span>
      <span class="proto" id="stateBadge">idle</span>
      <div class="spacer"></div>
      <button id="flowBtn">Run a flagship flow ▾</button>
      <button id="compactBtn" title="Toggle compact layout">Compact</button>
    </div>
    <div class="content" id="content">
      <div class="chat" id="chat"></div>
      <div class="pane" id="pane"></div>
      <div class="aside" id="aside"></div>
    </div>
  </div>
</div>

<!-- state switcher -->
<div class="statenav" id="statenav">
  <h4>Screen states</h4>
  <button data-state="idle">1. Idle desktop</button>
  <button data-state="mission">2. Mission running</button>
  <button data-state="browser">3. Browser / computer obs.</button>
  <button data-state="collab">4. Multi-agent collaboration</button>
  <button data-state="approval">5. Approval required</button>
  <button data-state="receipt">6. Verified completion</button>
  <button data-state="failure">7. Failed task + recovery</button>
  <button data-state="workspace">8. Personal workspace (PC)</button>
  <button data-state="bot">9. Bot details</button>
  <button data-state="compact">10. Compact / narrow</button>
  <div class="group">
    <h4>Flows</h4>
    <button data-flow="missioncontrol">▶ Mission Control flow</button>
    <button data-flow="receipt">▶ Outcome Receipt flow</button>
    <button data-flow="rehearse">▶ Rehearse flow</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const pane = document.getElementById('pane');
const aside = document.getElementById('aside');
const content = document.getElementById('content');
const stateBadge = document.getElementById('stateBadge');
const topTitle = document.getElementById('topTitle');

function setTheme(t){ document.documentElement.setAttribute('data-theme', t); }
document.getElementById('themeToggle').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
};

function clear(){ chat.innerHTML=''; pane.innerHTML=''; aside.innerHTML=''; content.classList.remove('has-pane','has-aside'); pane.classList.remove('open'); aside.classList.remove('open'); }

function showPane(html, asideHtml){ content.classList.add(asideHtml?'has-aside':'has-pane'); pane.innerHTML=html; if(asideHtml){ aside.innerHTML=asideHtml; } }

function state(s){
  document.querySelectorAll('.statenav button[data-state]').forEach(b=>b.classList.toggle('active', b.dataset.state===s));
  stateBadge.textContent = s;
  clear();
  switch(s){
    case 'idle': renderIdle(); break;
    case 'mission': renderMission(); break;
    case 'browser': renderBrowser(); break;
    case 'collab': renderCollab(); break;
    case 'approval': renderApproval(); break;
    case 'receipt': renderReceipt(); break;
    case 'failure': renderFailure(); break;
    case 'workspace': renderWorkspace(); break;
    case 'bot': renderBot(); break;
    case 'compact': renderCompact(); break;
  }
}

/* ---------- states ---------- */
function renderIdle(){
  topTitle.textContent='Pandesh';
  chat.innerHTML = `
    <div class="hero">Good morning, Sid.</div>
    <div class="sub">3 things need you · nothing running in the background</div>
    <div class="card" style="max-width:640px">
      <div class="h3">Recent receipts</div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">
        <div class="stamp verified">◉ Verified</div><span class="muted" style="font-size:12px">Disk analysis · 17s · 3 drives</span>
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px">
        <div class="stamp verified">◉ Verified</div><span class="muted" style="font-size:12px">Tip calculator · 47s · 5 tests</span>
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px">
        <div class="stamp verified">◉ Verified</div><span class="muted" style="font-size:12px">Ollama release research · 31s · 2 sources</span>
      </div>
    </div>
    <div class="card" style="max-width:640px">
      <div class="h3">Active work</div>
      <div class="muted" style="font-size:13px;margin-top:6px">Nothing running. Start something below.</div>
    </div>
  `;
  renderComposer();
}
function renderComposer(){
  const c = document.createElement('div');
  c.className='composer';
  c.innerHTML = `
    <div class="composer-box">
      <textarea placeholder="Ask Pandesh, or describe work to delegate…  (or say “Hey Jarvis”)"></textarea>
      <div class="composer-row">
        <button class="chip">📎 Attach</button>
        <button class="chip">🎙 Voice</button>
        <button class="chip pulse">📁 C:\\</button>
        <div class="spacer" style="flex:1"></div>
        <select style="background:var(--raised);border:1px solid var(--border);color:var(--ink);border-radius:4px;padding:4px 6px;font-size:12px"><option>Ask</option><option>Auto (24h)</option><option>Plan only</option></select>
        <select style="background:var(--raised);border:1px solid var(--border);color:var(--ink);border-radius:4px;padding:4px 6px;font-size:12px"><option>Auto (gemma4:12b)</option><option>qwen3.8:27b</option></select>
        <button class="btn btn-primary">Send</button>
      </div>
    </div>
  `;
  chat.appendChild(c);
}

function renderMission(){
  topTitle.textContent='Mission Control';
  chat.innerHTML = `
    <div class="hero" style="font-size:20px">Find what's eating space on C:.</div>
    <div class="sub">Mission started · 3 steps · local only</div>
    <div class="card" style="max-width:520px">
      <div class="row" style="margin-bottom:8px"><span class="dot running"></span><span style="font-weight:600">Mission running</span><span class="muted" style="margin-left:auto;font-family:var(--font-mono);font-size:11px">0:42</span></div>
      <div class="progress"><div style="width:66%"></div></div>
      <div class="muted" style="font-size:12px">2 of 3 steps · 1 needs you</div>
    </div>
  `;
  showPane(`
    <div class="h3">Mission Control</div>
    <div class="card" style="margin-bottom:12px">

/* ---------- flows ---------- */
function flowMissionControl(){
  // walk through: idle -> mission running -> approval -> receipt
  state('idle');
  setTimeout(()=>state('mission'), 1200);
  setTimeout(()=>state('approval'), 3200);
  setTimeout(()=>state('receipt'), 5200);
}
function flowReceipt(){
  state('receipt');
}
function flowRehearse(){
  state('idle');
  setTimeout(()=> {
    clear();
    topTitle.textContent='Rehearse before acting';
    chat.innerHTML = `<div class="hero" style="font-size:20px">Organize my Downloads — show me the plan first.</div><div class="sub">Read-only scan + plan · no changes yet</div>`;
    showPane(`
      <div class="h3">Rehearsal · 196 proposed moves · 0 changed</div>

/* wiring */
document.querySelectorAll('.statenav button[data-state]').forEach(b=>b.addEventListener('click',()=>state(b.dataset.state)));
document.querySelectorAll('.statenav button[data-flow]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.flow==='missioncontrol') flowMissionControl();
  if(b.dataset.flow==='receipt') flowReceipt();
  if(b.dataset.flow==='rehearse') flowRehearse();
}));
document.getElementById('flowBtn').addEventListener('click', flowMissionControl);
document.getElementById('compactBtn').addEventListener('click', ()=>state('compact'));

// init
state('idle');
