name: CI

on:
  push:
    branches: [main]
  # Stacked PRs (a feature PR on top of another feature PR) are validated before anything merges: a PR into a feature or fix
  # branch runs the same jobs, with its impacted tests taken against its own base (see the unit step).
  pull_request:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build 161 audit: five of the seven files once listed here were not timing problems. GitHub's Windows runners expose
# TEMP as an 8.3 short path (C:\Users\RUNNER~1\...), and four product checks compared a short spelling with the full one
# (a standing authorization that failed open, a governed write refused as "outside the workspace", a Kandev worktree
# "of a different repository"); the fifth asserted a 500 ms wall clock. Reproduced locally with TEMP set to a short
# path, fixed, and back in the required job. What remains here depends on the runner itself: a live headless browser
# (missionVerification) and runtime.test.ts, which has not failed since but stays visible until it is proven stable.
env:
  TIMING_SENSITIVE: >-
    core/test/missionVerification.test.ts
    core/test/runtime.test.ts

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: |
          npm ci
          npm ci --prefix apps/desktop
      - name: Typecheck
        # bash with -e: on a Windows runner the default shell let an earlier failing tsc pass when the last one succeeded.
        shell: bash
        run: |
          set -e
          npx tsc -p tsconfig.core.json --noEmit
          npx tsc -p ./ --noEmit
          npx tsc -p apps/desktop/renderer-v2/tsconfig.json --noEmit
      - name: Build bundles
        run: |
          node esbuild.core.js
          node apps/desktop/esbuild.mjs
      # The full Core and Desktop suites take ~25 minutes on a hosted runner. CI runs the unit tier only: the tests that import
      # a file this change touched (scripts/test-tiers.mjs unit). The full sweep, regression and acceptance tiers run locally
      # before a release (npm run test:full, test:regression, test:acceptance).
      - name: Unit tests (tests impacted by this change)
        shell: bash
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          if [ "${{ github.event_name }}" = "push" ]; then base="HEAD^"; fi
          node scripts/ci/ollama-tags-stub.mjs &
          node scripts/test-tiers.mjs unit --base "$base"

  timing-sensitive:
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node esbuild.core.js
      - name: Timing-sensitive Core tests (informational)
        shell: bash
        run: npx vitest run $TIMING_SENSITIVE --testTimeout=120000 --hookTimeout=120000
