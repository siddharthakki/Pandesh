name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build 161 audit: five of the seven files once listed here were not timing problems. GitHub's Windows runners expose
# TEMP as an 8.3 short path (C:\Users\RUNNER~1\...), and four product checks compared a short spelling with the full one
# (a standing authorization that failed open, a governed write refused as "outside the workspace", a Kandev worktree
# "of a different repository"); the fifth asserted a 500 ms wall clock. Reproduced locally with TEMP set to a short
# path, fixed, and back in the required job. What remains here depends on the runner itself: a live headless browser
# (missionVerification) and runtime.test.ts, which has not failed since but stays visible until it is proven stable.
env:
  TIMING_SENSITIVE: >-
    core/test/missionVerification.test.ts
    core/test/runtime.test.ts

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: |
          npm ci
          npm ci --prefix apps/desktop
      - name: Typecheck
        run: |
          npx tsc -p tsconfig.core.json --noEmit
          npx tsc -p ./ --noEmit
          npx tsc -p apps/desktop/renderer-v2/tsconfig.json --noEmit
      - name: Build bundles
        run: |
          node esbuild.core.js
          node apps/desktop/esbuild.mjs
      - name: Core tests (all but the timing-sensitive files)
        shell: bash
        run: |
          excludes=""; for f in $TIMING_SENSITIVE; do excludes="$excludes --exclude $f"; done
          npx vitest run core/test $excludes --testTimeout=120000 --hookTimeout=120000
      - name: Desktop tests
        # Desktop tests that check "is the selected model installed?" need an Ollama /api/tags endpoint; the runner has
        # no Ollama, so a stub that lists two model names (and serves nothing else) stands in.
        shell: bash
        run: |
          node scripts/ci/ollama-tags-stub.mjs &
          npx vitest run apps/desktop/test --testTimeout=120000 --hookTimeout=120000

  timing-sensitive:
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node esbuild.core.js
      - name: Timing-sensitive Core tests (informational)
        shell: bash
        run: npx vitest run $TIMING_SENSITIVE --testTimeout=120000 --hookTimeout=120000
